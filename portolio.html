<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>

  <body>
    <div id="main">
      <div id="sidebar">
        <div>
          <h3 style="display: flex; gap: 0.5rem; align-items: center">
            <img src="./public/logo.png" width="40" height="40" />CRYTO VAULT
          </h3>
        </div>
        <ul id="navlinks">
          <a href="index.html"
            ><li style="display: flex; gap: 1rem">
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-layout-grid-icon lucide-layout-grid"
                >
                  <rect width="7" height="7" x="3" y="3" rx="1" />
                  <rect width="7" height="7" x="14" y="3" rx="1" />
                  <rect width="7" height="7" x="14" y="14" rx="1" />
                  <rect width="7" height="7" x="3" y="14" rx="1" />
                </svg> </span
              >Home
            </li></a
          >
          <a href="portolio.html" class="active">
            <li style="display: flex; gap: 1rem">
              <span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-wallet-icon lucide-wallet"
                >
                  <path
                    d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
                  />
                  <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
                </svg> </span
              >Portfolio
            </li>
          </a>
        </ul>
      </div>
      <div id="home">
        <div id="nav">
          <div style="display: flex; gap: 1rem">
            <div id="searchbar">
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-search-icon lucide-search"
                >
                  <path d="m21 21-4.34-4.34" />
                  <circle cx="11" cy="11" r="8" /></svg
              ></span>
              <span>
                <input
                  type="text"
                  id="search"
                  name="search"
                  value=""
                  placeholder="Search Cryto"
                />
              </span>
            </div>
            <button
              style="
                padding: 10px 10px 10px 10px;
                border-radius: 5px;
                border: none;
                background-color: #059669;
                color: white;
              "
              onclick="searchCrypto()"
            >
              Search
            </button>
          </div>
          <button id="theme-toggle" onclick="toggleTheme()">Dark Mode</button>
        </div>
        
        <div id="portfolio-wrapper" style="padding: 2rem; margin-top: 5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2 style="text-transform: uppercase; font-size: 1.2rem; letter-spacing: 1px;">Asset Holdings</h2>
            <div style="display: flex; gap: 1rem; font-size: 0.9rem; color: gray;">
              <span style="cursor:pointer">≡ Filter</span>
              <span style="cursor:pointer">↓ Export</span>
            </div>
          </div>
          
          <div class="portfolio-container" id="port-container">
            <div id="portfolio-heading" style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; color: gray; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e1e3e5; text-transform: uppercase;">
              <p style="flex: 2; min-width: 200px;">Asset Name</p>
              <p style="flex: 1; text-align: right;">Balance (Mock)</p>
              <p style="flex: 1; text-align: right;">Current Price</p>
              <p style="flex: 1; text-align: right;">Market Value</p>
              <p style="flex: 1; text-align: right;">24H Change</p>
            </div>
            
            <div id="favorites-list" style="display: flex; flex-direction: column;">
               <p style="text-align:center; padding: 2rem; color: gray;">Loading favorites...</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="graph.js"></script>
    <script src="script.js"></script>
  </body>
</html>
